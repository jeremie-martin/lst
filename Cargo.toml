[workspace]
members = [
    "apps/lst-gpui",
    "crates/lst-editor",
    "crates/lst-x11-harness",
]
default-members = [
    "apps/lst-gpui",
    "crates/lst-editor",
]
resolver = "2"

[workspace.dependencies]
criterion = "0.8"
memchr = "2.7"
regex = "1.11"
ropey = "1.6.1"
unicode-segmentation = "1.12"
unicode-ident = "1.0"

[profile.release]
opt-level = 3
lto = true
strip = true

# Release code with symbols for `perf`; never used for shipping builds.
[profile.profiling]
inherits = "release"
debug = 1
strip = false

# Measured platform/rendering patches and a narrow upstream Blade backport.
# See each vendored crate's LST_PATCHES.md for rationale and removal criteria.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
blade-graphics = { path = "vendor/blade-graphics" }
