[nextest-version]
required = "0.9.115"
recommended = "0.9.133"

[profile.default]
retries = 0

[profile.x11]
default-filter = '''
package(lst-gpui)
& kind(test)
& binary(~real_x11_)
& not binary(=real_x11_multi_cursor_tdd)
'''
test-threads = 1
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2, grace-period = "10s" }
status-level = "pass"
final-status-level = "fail"

[profile.x11.junit]
path = "junit.xml"
report-name = "lst-x11"
store-success-output = false
store-failure-output = true

[profile.x11-stress]
inherits = "x11"

[profile.x11-stress.junit]
path = "junit.xml"
report-name = "lst-x11-stress"
store-success-output = false
store-failure-output = true

[profile.x11-tdd]
inherits = "x11"
default-filter = '''
package(lst-gpui)
& kind(test)
& binary(~real_x11_) & binary(~_tdd)
'''

[profile.x11-tdd.junit]
path = "junit.xml"
report-name = "lst-x11-tdd"
store-success-output = false
store-failure-output = true

[profile.x11-regression]
inherits = "x11"
default-filter = '''
package(lst-gpui)
& kind(test)
& binary(=real_x11_regressions)
'''

[profile.x11-regression.junit]
path = "junit.xml"
report-name = "lst-x11-regression"
store-success-output = false
store-failure-output = true
