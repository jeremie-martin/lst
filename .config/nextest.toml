[nextest-version]
required = "0.9.115"
recommended = "0.9.133"

[profile.default]
retries = 0

[profile.x11]
default-filter = '''
package(lst-gpui)
& kind(test)
& binary(~real_x11_)
& not binary(=real_x11_multi_cursor_spec)
& not (
    test(=alt_click_adds_secondary_cursor_at_click_point)
    | test(=alt_click_on_existing_cursor_removes_it)
    | test(=alt_enter_selects_all_current_find_matches)
    | test(=backspace_deletes_before_every_cursor_added_by_adjacent_line_commands)
    | test(=ctrl_f2_selects_all_occurrences_of_current_word)
    | test(=ctrl_s_on_unmodified_buffer_leaves_visible_state_unchanged)
    | test(=ctrl_k_ctrl_d_skip_via_held_modifier_grows_selection_set)
    | test(=ctrl_k_ctrl_d_skips_current_occurrence_and_adds_the_next)
    | test(=ctrl_u_pops_last_added_occurrence_cursor)
    | test(=delete_forward_deletes_after_every_cursor_added_by_adjacent_line_commands)
    | test(=duplicate_line_applies_to_every_cursor_line)
    | test(=paste_distribute_preserves_cursor_count_after_insertion)
    | test(=paste_distributes_clipboard_lines_to_matching_cursor_count)
    | test(=right_motion_advances_every_cursor_independently)
    | test(=right_motion_moves_every_cursor_before_literal_input)
    | test(=shift_click_extends_selection_from_caret)
    | test(=shift_alt_down_adds_adjacent_line_cursors_for_literal_input)
    | test(=shift_alt_down_adds_three_cursors_aligned_on_column_zero)
    | test(=shift_alt_i_adds_cursor_at_end_of_each_selected_line)
    | test(=smart_enter_inherits_each_cursor_line_indent)
    | test(=smart_enter_per_cursor_indent_lands_each_cursor_at_inherited_column)
    | test(=vertical_motion_per_cursor_preferred_column)
)
'''
test-threads = 1
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2, grace-period = "10s" }
status-level = "pass"
final-status-level = "fail"

[profile.x11.junit]
path = "junit.xml"
report-name = "lst-x11"
store-success-output = false
store-failure-output = true

